<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI Generator</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
    margin:0;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:200px;
    border-radius:10px;
    padding:15px;
    font-size:18px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

pre{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>⚒ Forge AI Generator</h1>

<textarea id="prompt" placeholder="Describe the software you want Forge to build..."></textarea>

<button onclick="generate()">
Generate Code
</button>

<pre id="output">
Waiting for project description...
</pre>

<script>
function generate() {

    const prompt = document.getElementById("prompt").value.trim();
    const output = document.getElementById("output");

    if (prompt === "") {
        output.textContent = "Please enter a project description.";
        return;
    }

    output.textContent =
`PROJECT GENERATED

Project:
${prompt}

Files:
• index.html
• style.css
• app.js
• README.md

Suggested Stack:
• HTML
• CSS
• JavaScript
• Node.js
• Supabase

Status:
Ready for AI backend integration.`;
}
</script>

</body>
</html>
