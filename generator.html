<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI Generator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#ff9800;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:16px;
    font-size:20px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#output{
    margin-top:20px;
    padding:20px;
    background:#222;
    border-radius:10px;
    white-space:pre-wrap;
    min-height:150px;
}
</style>
</head>

<body>

<div class="container">

<h1>Forge AI Generator</h1>

<textarea
id="prompt"
placeholder="Describe the app you want Forge to build..."
></textarea>

<button onclick="generateProject()">
Generate Project
</button>

<div id="output">
Waiting for prompt...
</div>

</div>

<script>
async function generateProject(){

const prompt=document.getElementById("prompt").value.trim();
const output=document.getElementById("output");

if(prompt===""){
output.textContent="Please enter a prompt.";
return;
}

output.textContent="Connecting to Forge AI...";

try{

const response=await fetch(
"https://shiny-mode-bff8.dsnuts2025tx.workers.dev",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:prompt
})
}
);

const data=await response.json();

output.textContent=
JSON.stringify(data,null,2);

}catch(error){

output.textContent=
"Connection failed.\n\n"+
error.message;

}

}
</script>

</body>
</html>
