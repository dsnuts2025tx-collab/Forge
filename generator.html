<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI Generator</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#ff9800;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    font-size:16px;
    border-radius:8px;
    border:none;
    margin-top:20px;
    resize:vertical;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#ff9800;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#output{
    margin-top:25px;
    background:#222;
    padding:20px;
    border-radius:8px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>⚒ Forge AI Generator</h1>

<textarea id="prompt" placeholder="Describe the app you want Forge to build..."></textarea>

<button onclick="generateProject()">
Generate Project
</button>

<div id="output">
Waiting for prompt...
</div>

    <script>
async function generateProject(){

const prompt=document.getElementById("prompt").value;
const output=document.getElementById("output");

if(prompt.trim()===""){
output.textContent="Please enter a project description.";
return;
}

output.textContent="Generating...";

try{

const response=await fetch("https://shiny-mode-bff8.dsnuts2025tx.workers.dev");

const data=await response.json();

output.textContent=
"Status: "+data.status+
"\nMessage: "+data.message+
"\nVersion: "+data.version+
"\n\nPrompt:\n"+prompt;

}catch(err){

output.textContent="Connection failed.\n\n"+err;

}

}
</script>

</body>
</html>
