<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050b"><title>Forge AI Builder</title><style>body{margin:0;background:#03050b;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:42px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:26px;font-weight:900}.brand b{color:#278fff}.muted{color:#aeb8cc;line-height:1.6}.card{margin-top:20px;padding:24px;border:1px solid #29405f;border-radius:14px;background:#08101d}label{display:block;margin:16px 0 8px;font-weight:700}input,textarea{width:100%;box-sizing:border-box;padding:14px;border-radius:9px;border:1px solid #38506f;background:#050a12;color:white;font:inherit}button,.btn{margin-top:20px;padding:14px 20px;border:1px solid #4aa9ff;border-radius:9px;background:linear-gradient(135deg,#258fff,#5a47ff);color:white;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#07101d;border-color:#38506f}.actions{display:flex;gap:10px;flex-wrap:wrap}button:disabled{opacity:.6;cursor:wait}#status,#result{display:none;margin-top:20px;padding:18px;border-radius:12px;background:#050a12;border:1px solid #22354e}pre{white-space:pre-wrap;word-break:break-word}.pill{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#10233c;color:#9fc8ff;font-size:12px}.ok{color:#47e0a3}.warn{color:#ffd27a}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">FORGE <b>POWER</b></div><p class="muted">Tell Forge what you want. Forge returns a structured project.</p><span class="pill" id="access">Checking production access…</span></div><div class="actions"><a class="btn secondary" href="/">Home</a><a class="btn secondary" href="/dashboard">Dashboard</a></div></div><div class="card"><label for="project">Project Name</label><input id="project" placeholder="My new application" autocomplete="off"><label for="description">Application Description</label><textarea id="description" rows="9" placeholder="Describe what you want Forge to build..."></textarea><button id="buildButton" onclick="createProject()">🚀 Build with AI</button><div id="status">🔥 Forge is building…</div><div id="result"><pre id="output"></pre></div></div></main><script>
const KEY='forge_project_key';
async function access(){const token=localStorage.getItem('forge_session');if(!token){document.getElementById('access').textContent='Guest build';return}try{const r=await fetch('/api/entitlement',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();document.getElementById('access').textContent=d.entitlement?.active?'Production access active':'Billing access pending'}catch{document.getElementById('access').textContent='Access check unavailable'}}
function localPreview(project,description){return {projectName:project,description,files:[{path:'index.html',content:`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${project}</title></head><body><main><h1>${project}</h1><p>${description}</p></main></body></html>`},{path:'README.md',content:`# ${project}\n\n${description}\n\nGenerated as a Forge local preview.`}]}}
async function persist(project){try{const r=await fetch('/api/state/'+encodeURIComponent(KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projects:[project]})});return r.ok}catch{return false}}
async function createProject(){const name=document.getElementById('project').value.trim(),description=document.getElementById('description').value.trim(),status=document.getElementById('status'),result=document.getElementById('result'),output=document.getElementById('output'),button=document.getElementById('buildButton');if(!name||!description){alert('Please complete both fields.');return}status.style.display='block';result.style.display='none';button.disabled=true;try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:'openrouter',prompt:`Project:\n${name}\n\nDescription:\n${description}`})});const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=null}let mode='AI build';if(r.ok&&d?.project)d=d.project;else if(r.ok&&d?.projectName)d=d;else if(r.status===503&&d?.error?.includes('OPENROUTER_API_KEY')){d=localPreview(name,description);mode='local preview — AI provider not configured'}else throw Error(d?.error||`Forge API request failed (${r.status})`);const saved=await persist({id:crypto.randomUUID(),name,description,build:d,createdAt:new Date().toISOString()});status.style.display='none';result.style.display='block';output.innerHTML=`<span class="${mode==='AI build'?'ok':'warn'}">✓ ${mode}</span>\n\n`+JSON.stringify({project:d,saved},null,2)}catch(e){status.style.display='none';result.style.display='block';output.textContent='❌ Forge Build Error:\n\n'+e.message}finally{button.disabled=false}}access();
</script></body></html>
