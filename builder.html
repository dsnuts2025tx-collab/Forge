<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge AI Builder</title><style>body{margin:0;background:#03050b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1000px;margin:auto;padding:42px 20px}.brand{font-size:26px;font-weight:900}.brand b{color:#278fff}.muted{color:#aeb8cc}.card{margin-top:20px;padding:24px;border:1px solid #29405f;border-radius:14px;background:#08101d}label{display:block;margin:16px 0 8px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;padding:14px;border-radius:9px;border:1px solid #38506f;background:#050a12;color:white;font:inherit}button{margin-top:20px;padding:14px 20px;border:0;border-radius:9px;background:linear-gradient(135deg,#258fff,#5a47ff);color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.6}#status,#result{display:none;margin-top:20px;padding:18px;border-radius:12px;background:#050a12;border:1px solid #22354e}pre{white-space:pre-wrap;word-break:break-word}.pill{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#10233c;color:#9fc8ff;font-size:12px}</style></head><body><main class="wrap"><div class="brand">FORGE <b>POWER</b></div><p class="muted">TELL FORGE. MAKE IT.</p><div class="card"><span class="pill" id="access">Checking production access…</span><label>Project Name</label><input id="project" placeholder="My new application" autocomplete="off"><label>Application Description</label><textarea id="description" rows="9" placeholder="Describe what you want Forge to build..."></textarea><button id="buildButton" onclick="createProject()">🚀 Build with AI</button><div id="status">🔥 Forge AI is building…</div><div id="result"><pre id="output"></pre></div></div></main><script>
async function access(){const token=localStorage.getItem('forge_session');if(!token){document.getElementById('access').textContent='Guest build';return}try{const r=await fetch('/api/entitlement',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();document.getElementById('access').textContent=d.entitlement?.active?'Production access active':'Billing access pending'}catch{document.getElementById('access').textContent='Access check unavailable'}}
async function createProject(){const project=document.getElementById('project').value.trim(),description=document.getElementById('description').value.trim(),status=document.getElementById('status'),result=document.getElementById('result'),output=document.getElementById('output'),button=document.getElementById('buildButton');if(!project||!description){alert('Please complete both fields.');return}status.style.display='block';result.style.display='none';button.disabled=true;try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:'openrouter',prompt:`Project:\n${project}\n\nDescription:\n${description}`})});const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=text}if(!r.ok)throw Error(typeof d==='string'?d:(d.error||d.message||`API request failed (${r.status})`));status.style.display='none';result.style.display='block';output.textContent=typeof d==='string'?d:JSON.stringify(d,null,2);localStorage.setItem('forge_project_key','default')}catch(e){status.style.display='none';result.style.display='block';output.textContent='❌ Forge API Error:\n\n'+e.message}finally{button.disabled=false}}access();
</script></body></html>
