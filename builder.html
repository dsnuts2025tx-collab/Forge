<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI Builder</title>

<style>
body{
margin:0;
padding:0;
background:#0b1020;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:1000px;
margin:auto;
padding:40px;
}

h1{
margin-bottom:10px;
}

p{
color:#cbd5e1;
margin-bottom:20px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin:12px 0;
border:none;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
padding:15px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#status,
#result{
display:none;
margin-top:25px;
background:#111827;
padding:20px;
border-radius:12px;
}

pre{
white-space:pre-wrap;
word-break:break-word;
}
</style>

</head>

<body>

<div class="container">

<h1>🔥 Forge AI Builder</h1>

<p>Describe the application you want Forge AI to build.</p>

<label>AI Provider</label>

<select id="provider">
<option value="openrouter" selected>OpenRouter</option>
</select>

<input
id="project"
placeholder="Project Name">

<textarea
id="description"
rows="10"
placeholder="Describe your application..."></textarea>

<button onclick="createProject()">
🚀 Build with AI
</button>

<div id="status">
Forge AI is thinking...
</div>

<div id="result">

<h2>Forge Result</h2>

<pre id="output"></pre>

</div>

</div>

<script>

async function createProject(){

const provider=document.getElementById("provider").value;
const project=document.getElementById("project").value.trim();
const description=document.getElementById("description").value.trim();

const status=document.getElementById("status");
const result=document.getElementById("result");
const output=document.getElementById("output");

if(!project||!description){

alert("Please complete both fields.");

return;

}

status.style.display="block";
result.style.display="none";
status.innerHTML="🔥 Forge AI is thinking...";

try{

const response=await fetch(
"/api",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

provider,

prompt:

`Project:

${project}

Description:

${description}`

})

}

);

const text=await response.text();

let data;

try{

data=JSON.parse(text);

}catch{

data=text;

}

status.style.display="none";

result.style.display="block";

output.textContent=

typeof data==="string"

?data

:JSON.stringify(data,null,2);

}

catch(error){

status.style.display="none";

result.style.display="block";

output.textContent=

"❌ "+error.message;

}

}

</script>

</body>
</html>
