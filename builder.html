<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Builder</title>

<style>
body{
background:#0b1020;
color:white;
font-family:Arial,sans-serif;
padding:40px;
margin:0;
}

.container{
max-width:900px;
margin:auto;
}

h1{
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:15px;
margin:15px 0;
font-size:18px;
border-radius:10px;
border:none;
box-sizing:border-box;
}

button{
padding:15px 30px;
font-size:20px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#result{
display:none;
margin-top:30px;
background:#111827;
padding:20px;
border-radius:12px;
white-space:pre-wrap;
overflow:auto;
}
</style>

</head>

<body>

<div class="container">

<h1>🔥 Forge AI Builder</h1>

<p>Describe the application you want Forge to build.</p>

<input
id="project"
placeholder="Project Name">

<textarea
id="description"
rows="10"
placeholder="Describe your application..."></textarea>

<button onclick="createProject()">
Build with AI
</button>

<div id="result"></div>

</div>

<script>

async function createProject(){

const project=document.getElementById("project").value.trim();
const description=document.getElementById("description").value.trim();

if(!project||!description){
alert("Please complete both fields.");
return;
}

const result=document.getElementById("result");

result.style.display="block";
result.innerHTML="<h2>Forge AI is thinking...</h2>";

try{

const response=await fetch("/api",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

prompt:`Project: ${project}

${description}`

})

});

if (!response.ok) {
    throw new Error(await response.text());
}

const data = await response.json();

result.innerHTML=`
<h2>✅ AI Response</h2>
<pre>${JSON.stringify(data,null,2)}</pre>
`;

}

catch(err){

result.innerHTML=`
<h2>❌ Error</h2>
<pre>${err}</pre>
`;

}

}

</script>

</body>
</html>
