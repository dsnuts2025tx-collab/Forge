<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge AI Planner</title>

<style>
body{
margin:0;
background:#0f172a;
font-family:Arial,sans-serif;
color:white;
}

header{
background:#182235;
padding:25px;
text-align:center;
font-size:36px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

textarea{
width:100%;
height:180px;
padding:15px;
font-size:18px;
border-radius:10px;
border:none;
margin-bottom:20px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
font-size:22px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.card{
margin-top:25px;
background:#1e293b;
padding:20px;
border-radius:12px;
}

ul,ol{
line-height:1.8;
}
</style>
</head>

<body>

<header>🔥 Forge AI Planner</header>

<div class="container">

<h2>Describe your application</h2>

<textarea id="prompt" placeholder="Example: Build an AI-powered motorcycle repair shop management system..."></textarea>

<button onclick="generatePlan()">
Generate Project Plan
</button>

<div id="output" class="card">
Enter a project description above and tap <b>Generate Project Plan</b>.
</div>

</div>

<script>

async function generatePlan() {

const prompt = document.getElementById("prompt").value.trim();

if (!prompt) {
    alert("Please describe your project.");
    return;
}

document.getElementById("output").innerHTML =
"<h2>Forge AI is thinking...</h2>";

try {

const response = await fetch("/api", {

method: "POST",

headers: {
"Content-Type":"application/json"
},

body: JSON.stringify({
prompt
})

});

const data = await response.json();

document.getElementById("output").innerHTML =
`<pre>${JSON.stringify(data,null,2)}</pre>`;

}
catch(err){

document.getElementById("output").innerHTML =
`<h2>Error</h2><pre>${err}</pre>`;

}

}

const prompt=document.getElementById("prompt").value.trim();

if(prompt===""){
alert("Please describe your project.");
return;
}

document.getElementById("output").innerHTML=`
<h2>📋 Project Summary</h2>

<p>${prompt}</p>

<h3>Core Features</h3>

<ul>
<li>User Authentication</li>
<li>Dashboard</li>
<li>Customer Management</li>
<li>Inventory</li>
<li>Reports</li>
<li>AI Assistant</li>
</ul>

<h3>Suggested Technology</h3>

<ul>
<li>Frontend: HTML, CSS, JavaScript</li>
<li>Backend: Node.js</li>
<li>Database: Supabase</li>
<li>Hosting: Cloudflare Pages</li>
<li>Repository: GitHub</li>
</ul>

<h3>Development Roadmap</h3>

<ol>
<li>Planning</li>
<li>Database Design</li>
<li>Authentication</li>
<li>Dashboard</li>
<li>AI Integration</li>
<li>Testing</li>
<li>Deployment</li>
</ol>
`;

}

</script>

</body>
</html>
