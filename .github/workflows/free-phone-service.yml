name: Free Phone Service

on:
  push:
    branches: [main, feature/free-phone-service]
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/free-phone-service.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run
