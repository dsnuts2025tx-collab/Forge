name: Phantom Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phantom-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run workflow:verify
      - run: npm run phantom:production-authority:verify
      - run: npm run deployment:verify
      - run: npm run check
      - run: npm run phantom:overdrive:verify
      - run: npm run phantom:capability-compiler:self-test
      - run: npm run phone-service:self-test
      - run: npm run phantom:production-control:self-test
      - name: Upload capability compiler proof
        uses: actions/upload-artifact@v4
        with:
          name: phantom-capability-compiler-proof-${{ github.sha }}
          path: artifacts/capability-compiler-proof.json
          if-no-files-found: error
