name: Phantom Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phantom-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run workflow:verify
      - run: npm run check
      - run: npm run phantom:overdrive:verify
      - run: npm run phantom:capability-compiler:self-test
      - run: npm run phone-service:self-test
      - name: Upload capability compiler proof
        uses: actions/upload-artifact@v4
        with:
          name: phantom-capability-compiler-proof-${{ github.sha }}
          path: artifacts/capability-compiler-proof.json
          if-no-files-found: error
