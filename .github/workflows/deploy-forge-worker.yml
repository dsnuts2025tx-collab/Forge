name: Deploy Forge Runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Forge runtime
        run: |
          test -f worker.js
          test -f runtime-entry.js
          test -f wrangler.jsonc
          test -f index.html
          test -f builder.html
          test -f dashboard.html
          test -f projects.html
          test -f settings.html
          test -f generator.html
          test -f playground.html
          test -f billing.html
          echo "Forge runtime package validated"

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create verified deployable package
        run: |
          mkdir -p dist
          cp worker.js runtime-entry.js wrangler.jsonc index.html builder.html dashboard.html projects.html settings.html generator.html playground.html billing.html dist/
          echo "Forge Engine 6.0.0-PLATINUM" > dist/BUILD.txt
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const files = ['worker.js','runtime-entry.js','wrangler.jsonc','BUILD.txt'];
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(`dist/${file}`)).digest('hex');
          const release = {
            engine: 'Forge Engine 6.0.0-PLATINUM',
            sourceCommit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
            artifacts: Object.fromEntries(files.map(file => [file, sha256(file)])),
          };
          fs.writeFileSync('dist/RELEASE.json', JSON.stringify(release, null, 2) + '\n');
          NODE
          test -f dist/RELEASE.json
          grep -Fq "${GITHUB_SHA}" dist/RELEASE.json
          grep -Fq 'Forge Engine 6.0.0-PLATINUM' dist/BUILD.txt
      - name: Upload verified Forge package
        uses: actions/upload-artifact@v4
        with:
          name: forge-production-package
          path: dist/

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download verified Forge package
        uses: actions/download-artifact@v4
        with:
          name: forge-production-package
          path: dist
      - name: Verify packaged runtime
        working-directory: dist
        run: |
          test -f RELEASE.json
          test -f worker.js
          test -f runtime-entry.js
          test -f wrangler.jsonc
          grep -Fq "${GITHUB_SHA}" RELEASE.json
          grep -Fq 'Forge Engine 6.0.0-PLATINUM' BUILD.txt
      - name: Deploy Forge runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.jsonc

# Production execution authority is the established Cloudflare Workers build/deployment
# integration for Forge. The package is created and verified before deployment; no second
# deployment authority is introduced. Live runtime proof remains a separate gate.
