<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050816"><title>Forge Billing</title><style>body{margin:0;background:#03050b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:48px 20px}.brand{font-size:28px;font-weight:900}.brand b{color:#2b91ff}.card{margin-top:28px;padding:28px;border:1px solid #29405f;border-radius:16px;background:#08101d}p{color:#aeb8cc;line-height:1.6}input{width:100%;box-sizing:border-box;padding:14px;border-radius:9px;border:1px solid #38506f;background:#050a12;color:white;margin:12px 0 16px}button{padding:14px 20px;border:0;border-radius:9px;background:linear-gradient(135deg,#258fff,#5a47ff);color:white;font-weight:800;cursor:pointer}#msg{margin-top:18px;color:#9db8df;white-space:pre-wrap}</style></head><body><main class="wrap"><div class="brand">FORGE <b>POWER</b></div><div class="card"><h1>Start Forge</h1><p>Secure checkout and production entitlement are handled by Forge's server-side billing layer.</p><input id="email" type="email" placeholder="Email address" autocomplete="email"><button id="go">Continue to secure checkout</button><div id="msg"></div></div></main><script>
const msg=document.getElementById('msg');
async function finish(){const id=new URLSearchParams(location.search).get('session_id');if(!id)return;msg.textContent='Finalizing your Forge session…';try{const r=await fetch('/api/billing/session?session_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to finalize checkout');localStorage.setItem('forge_session',d.token);msg.textContent='Forge access is ready. You can return to the Builder.';setTimeout(()=>location.href='/builder',900)}catch(e){msg.textContent='Could not finalize checkout: '+e.message}}
finish();
document.getElementById('go').onclick=async()=>{msg.textContent='Opening secure checkout…';try{const r=await fetch('/api/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Checkout unavailable');location.href=d.url}catch(e){msg.textContent='Checkout is not ready yet: '+e.message}};
</script></body></html>
