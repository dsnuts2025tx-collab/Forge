<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:#fff;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:14px 24px;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}
</style>

</head>
<body>

<header>
🔥 Forge Dashboard
</header>

<div class="container">

<div class="card">
<h2>Current Project</h2>
<p>No active project.</p>
</div>

<div class="card">
<h2>Build Status</h2>
<p>🟢 Ready</p>
</div>

<div class="card">
<h2>AI Builder</h2>
<p>Forge AI will generate your application here.</p>
<button>Start AI Build</button>
</div>

<div class="card">
<h2>Deployment</h2>
<p>No deployments yet.</p>
<button>Deploy</button>
</div>

</div>

</body>
</html>
