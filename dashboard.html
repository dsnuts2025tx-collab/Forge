<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

button{
padding:15px 25px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}
</style>
</head>

<body>

<header>
🔥 Forge Dashboard
</header>

<div class="container">

<div class="card">
<h2>Current Project</h2>

<p><strong>Project:</strong></p>
<p id="projectName"></p>

<p><strong>Description:</strong></p>
<p id="projectDescription"></p>

</div>

<div class="card">
<h2>Status</h2>
<p id="status">🟢 Ready to Build</p>
</div>

<div class="card">
<h2>Forge AI</h2>

<p>Press the button to begin building your application.</p>

<button onclick="startBuild()">Start AI Build</button>

</div>

<div class="card">
<h2>Deployment</h2>

<p>Deployment tools coming soon.</p>

<button>Deploy</button>

</div>

</div>

<script>

document.getElementById("projectName").innerText =
localStorage.getItem("forgeProject") || "No Project";

document.getElementById("projectDescription").innerText =
localStorage.getItem("forgeDescription") || "No description.";

function startBuild(){

document.getElementById("status").innerText =
"🟡 Building Phantom Playground...";

setTimeout(function(){

document.getElementById("status").innerText =
"✅ Build Complete";

},3000);

}

</script>

</body>
</html>
