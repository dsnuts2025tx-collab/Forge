<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.button{
display:inline-block;
padding:15px 25px;
font-size:18px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:8px;
}
</style>

</head>

<body>

<header>
🔥 Forge Dashboard
</header>

<div class="container">

<div class="card">
<h2>Current Project</h2>

<p><strong>Project:</strong></p>
<p id="projectName"></p>

<p><strong>Description:</strong></p>
<p id="projectDescription"></p>

</div>

<div class="card">
<h2>Status</h2>

<p id="status">✅ Build Complete</p>

</div>

<div class="card">

<h2>Launch Project</h2>

<p>Your first Forge-built application is ready.</p>

<a class="button" href="playground.html">
Open Phantom Playground
</a>

</div>

</div>

<script>

document.getElementById("projectName").innerText =
localStorage.getItem("forgeProject") || "No Project";

document.getElementById("projectDescription").innerText =
localStorage.getItem("forgeDescription") || "No description.";

</script>

</body>
</html>
