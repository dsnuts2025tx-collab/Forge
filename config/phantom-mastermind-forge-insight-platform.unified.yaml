# PHANTOM MASTERmind — FORGE — INSIGHT — PLATFORM UNIFIED CONFIGURATION
# Version: 1.0.0-unified-staging
# Date: 2026-09-02
#
# IMPORTANT:
# This is an external staging representation of the unified configuration.
# It MUST NOT become a competing canonical configuration. The Phantom-owned
# canonical configuration authority remains authoritative and this file must
# be reconciled into that authority through its approved lock/promotion path.

phantom:
  name: Phantom
  authority:
    operational: Phantom Mastermind
    execution: Phantom Pathway
    evidence: Phantom Footprints
  canonical_control:
    source: phantom-owned
    configuration: phantom-owned
    deployment_plane: phantom-owned
    runtime: phantom-owned
    data: phantom-owned
    business_logic: phantom-owned
  external_platform_policy:
    github: boundary_adapter_only
    vercel: boundary_adapter_only
    cloudflare: boundary_adapter_only
    replit: boundary_adapter_only
    other_providers: boundary_adapter_only
    rule: no_external_provider_is_canonical_authority

mastermind:
  role: highest_operational_authority
  mission: >-
    Build, maintain, verify, operate, improve and keep Phantom applications
    production-ready under one authoritative configuration and evidence chain.
  operating_loop:
    - OBSERVE
    - UNDERSTAND
    - REASON
    - SIMULATE
    - TEST
    - CANARY
    - DEPLOY
    - MEASURE
    - LEARN
    - IMPROVE
  command_translation:
    input: natural_language_user_intent
    translator: mastermind.intent_translator
    output: MastermindDirective
    preserve:
      - objective
      - scope
      - priority
      - constraints
      - prohibitions
      - privacy
      - locked_invariants
  memory:
    mode: persistent_mass_memory
    required: true
    layers:
      - canonical_configuration
      - architecture
      - project_state
      - release_state
      - deployment_state
      - evidence
      - decisions
      - incidents
      - recovery_history
      - research
      - worker_knowledge
      - task_context
    retrieval:
      - exact
      - keyword
      - semantic
      - temporal
      - entity
      - dependency
      - incident
      - decision
    integrity:
      provenance_required: true
      source_identity_required: true
      version_required: true
      conflict_detection_required: true
      immutable_locked_history: true
      point_in_time_restore: true
      exportable: true
    rule: never silently convert inference into canonical fact

capability_fabric:
  name: Phantom Gadget Fabric
  authority: Phantom Mastermind
  pathway: Phantom Pathway
  functions:
    - discover
    - authorize
    - execute
    - observe
    - verify
    - evidence
    - audit
    - recover
    - lock
  execution_policy:
    capability_scoped: true
    authenticated: true
    authorized: true
    idempotent: true
    footprinted: true

engineering:
  detective:
    id: engineering.detective
    purpose: diagnose_any_authorized_software_or_infrastructure_problem
    loop:
      - inspect
      - preserve_evidence
      - reproduce
      - correlate
      - hypothesize
      - test
      - root_cause
      - repair_recommendation
  emt:
    id: engineering.emt
    purpose: emergency_stabilization_repair_and_recovery
    priority: critical
    loop:
      - detect
      - classify
      - freeze_unsafe_mutation
      - checkpoint
      - isolate
      - repair_or_rollback
      - retest
      - verify
      - restore
      - footprint
      - learn
    invariant: emergency_speed_never_bypasses_security_authority_or_evidence
  intent_translator:
    id: mastermind.intent_translator
    purpose: direct_user_intent_to_mastermind
    stages:
      - parse
      - normalize
      - extract_constraints
      - resolve_configuration
      - route_capabilities
      - create_directive
      - execute_through_pathway
      - report_verified_result

phantom_x_platform:
  name: Phantom X
  role: first_party_launch_deploy_command_center
  purpose: >-
    Unified command center for BUILD, VERIFY, PROVE, LAUNCH, DEPLOY, LAND,
    LIVE VERIFY, OPERATE, AUDIT and ROLLBACK.
  promotion_chain:
    - SOURCE
    - REPOSITORY_AUTHORITY
    - BUILD
    - TEST
    - PROVE
    - APPROVE
    - LAUNCH
    - DEPLOY
    - LAND
    - LIVE_VERIFY
    - OPERATE
    - AUDIT_OR_ROLLBACK
  command_states:
    - DRAFT
    - BUILDING
    - TESTING
    - VERIFYING
    - PROVEN
    - APPROVED
    - LAUNCHING
    - DEPLOYING
    - LANDING
    - LIVE
    - DEGRADED
    - ROLLBACK
    - RETIRED
  authorities:
    repository_creation: Repository Creation Authority Agent
    repository_boundary: Repository Precinct
    build: Build Authority
    verification: Verification Authority
    launch: Launch Authority
    deployment: Deployment Authority
    land: Land Authority
    runtime: Runtime Authority

forge:
  name: Forge
  version: v2.1
  role: public_website_and_application_builder
  engine_role: build_test_validate_deploy_engine
  source_language: TypeScript
  capabilities:
    - built_in_templates
    - preconfigured_stacks
    - model_and_worker_configuration
    - drag_and_drop_builder
    - app_workflows
    - api_building
    - isolated_testing
    - version_control
    - worker_creation
    - integration_hub
    - security_by_design
    - one_click_deploy_intent
  fast_launch:
    objective: seconds_class_launch_for_approved_low_risk_sites
    mechanisms:
      - warm_build_workers
      - parallel_build_tasks
      - dependency_cache
      - artifact_cache
      - reusable_verified_templates
      - incremental_builds
      - preflight_validation
      - automated_smoke_tests
    constraint: live_status_requires_real_verification
  build_pipeline:
    - intake
    - design
    - build
    - isolated_test
    - security
    - performance
    - artifact_identity
    - verification
    - deployment
    - live_verification
    - footprint
  current_repo_controls:
    typecheck: tsc --noEmit
    workflow_verify: node scripts/verify-phantom-workflow.mjs
    deployment_verify: node scripts/verify-phantom-deployment-workflow.mjs
    capability_compiler_self_test: node --experimental-strip-types src/phantom/capability-compiler.self-test.ts
    overdrive_verify: node scripts/verify-overdrive.mjs
    production_control_self_test: node --experimental-strip-types src/phantom/production-control-surface.self-test.ts
    production_authority_verify: node scripts/verify-phantom-production-authority-binding.mjs

insight:
  name: Phantom Insight
  primary_ai: PHIA
  role: priority_application_of_phantom_x
  mission: >-
    Premium educational AI platform for exploration of symbolism, mythology,
    dreams, history, philosophy, folklore, cultural traditions and personal
    reflection.
  architecture:
    coordinator: PHIA
    specialist_council: Council of Insight
    specialists:
      - Astrology
      - Dream Symbolism
      - Tarot
      - Numerology
      - Palmistry
      - Mythology
      - Mythical Creatures
      - Spirit Animals
      - Archetypes
      - Psychology
      - Meditation
