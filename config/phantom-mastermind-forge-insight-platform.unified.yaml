runtime_security:
  authority: Phantom Mastermind
  pathway: Phantom Pathway
  runtime: phantom-owned
  public_control_plane_access: false
  public_internal_access: false
  public_mutation_access: false
  public_pathway_access: false
  control_authentication: attested_capability_scoped_requests
  replay_protection: timestamp_plus_nonce
  transport: private_network_or_unix_socket_plus_tls_mtls
  artifact_integrity: SHA-256
  max_request_age_ms: 30000
  max_body_bytes: 1048576
  public_routes:
    allow:
      - /
      - /health
      - /ready
      - /version
      - /release
    deny:
      - /internal/*
      - /control/*
      - /api/phantom/pathway
      - public_mutation

verification:
  before_live:
    source_integrity:
      - correct_source
      - provenance
      - dependency_review
      - prohibited_dependency_check
    build_integrity:
      - reproducible_build_or_equivalent
      - successful_build
      - artifact_identity
      - checksum
    functional:
      - startup
      - critical_routes
      - core_workflows
      - api_behavior
      - persistence_when_applicable
    security:
      - authentication
      - authorization
      - secret_handling
      - input_validation
      - dependency_security
      - isolation
    policy:
      - phantom_architecture_compatibility
      - external_boundary_compliance
      - lawful_control_preservation
      - privacy_compliance
    runtime:
      - health
      - readiness
      - telemetry
      - error_detection
      - rollback_readiness
    evidence:
      - release_id
      - source_revision
      - build_result
      - verification_result
      - deployment_event
      - live_verification_result
      - footprint
  live_claim_rule: no_live_claim_without_live_verification

footprints:
  name: Phantom Footprints
  purpose: immutable_attributable_operational_evidence
  records:
    - request_identity
    - authority
    - capability
    - project
    - release
    - artifact
    - build
    - verification
    - deployment
    - runtime_state
    - incident
    - rollback
    - recovery
    - research_provenance
  policy:
    append_evidence: true
    preserve_failed_release_evidence: true
    immutable_locked_records: true
    audit_ready: true

recovery:
  strategy:
    - detect
    - freeze
    - identify_last_verified_release
    - restore
    - health_check
    - live_verify
    - record_incident
    - audit
  checkpoints:
    before_repair: true
    after_repair: true
  backups:
    immutable_snapshots: true
    point_in_time_restore: true

shared_state:
  single_source_of_truth: true
  synchronization:
    mastermind: continuous
    pathway: on_config_change_and_release
    footprints: immediate_append
    forge: before_task_and_on_lock_change
    insight: before_release_and_runtime_change
    workers: before_task_start
    incidents: event_driven
    research: ingestion_and_review
  drift_policy:
    configuration_drift: incident
    worker_drift: incident
    release_drift: incident
    silent_override: prohibited

resource_model:
  requested_capability: elastic_authorized_capacity
  target: remove_artificial_resource_bottlenecks
  scalable_dimensions:
    - workers
    - concurrency
    - compute
    - storage
    - model_capacity
    - build_cache
    - queue_capacity
    - memory_index
  constraint: physical_and_authorized_limits_still_apply

production_readiness:
  insight:
    local_verified: true
    public_live: false
    reason: actual_phantom_controlled_host_network_hostname_tls_and_external_reachability_are_required
  forge:
    role: production_build_and_deployment_engine
    public_claim: evidence_required

master_rule:
  statement: >-
    Mastermind, Forge, Phantom Insight, Phantom X, Phantom Pathway, Phantom
    Footprints, the capability fabric, security boundary, memory fabric,
    verification system, runtime, recovery system and all authorized workers
    operate as one Phantom-controlled system. New capabilities must integrate
    with this configuration rather than create competing authority.
