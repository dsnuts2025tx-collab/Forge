  payments:
    architecture_ready_for:
      - Stripe
      - Apple_Pay
      - Google_Pay
      - Credit_Debit_Cards
      - PayPal_where_available
    controls:
      - secure_checkout
      - billing_dashboard
      - subscriptions
      - invoices
      - receipts
      - payment_history
      - upgrades_downgrades
      - renewals
      - cancellation
      - refund_request_information
  authentication:
